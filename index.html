<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valmentaja Laura Harvistola</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #f5f1ed;
      --white: #fffdfb;
      --beige: #eee5df;
      --rose: #bd8578;
      --rose-dark: #a96f63;
      --brown: #67554e;
      --text: #292522;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
    }


    /* HEADER */

    header {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: rgba(255,253,251,.97);
    }

    .brand {
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .brand-top {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--rose);
      margin-bottom: 1px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      gap: 38px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .5px;
      transition: .2s;
    }

    nav a:hover {
      color: var(--rose);
    }

    .language {
      font-size: 12px;
      letter-spacing: 1px;
    }


    /* HERO */

    .hero {
      min-height: 670px;
      display: grid;
      grid-template-columns: 49% 51%;
      background: var(--white);
    }

    .hero-content {
      padding: 90px 10% 85px 12%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      color: var(--rose);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.1px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(48px, 5vw, 76px);
      font-weight: 300;
      line-height: 1.04;
      letter-spacing: -3px;
    }

    h1 span {
      color: var(--rose);
    }

    .small-line {
      width: 48px;
      height: 2px;
      background: var(--rose);
      margin: 32px 0;
    }

    .hero-text {
      max-width: 500px;
      font-size: 15px;
      line-height: 1.85;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      width: fit-content;
      text-decoration: none;
      color: white;
      background: var(--rose);
      border: none;
      padding: 15px 30px;
      border-radius: 6px;
      font-family: "DM Sans", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.2px;
      transition: .25s;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--rose-dark);
      transform: translateY(-2px);
    }

    .hero-image {
      min-height: 670px;
      background-image: url("kansikuva.jpeg");
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
    }


    /* BENEFITS */

    .benefits {
      background: var(--beige);
      padding: 34px 6%;
      display: grid;
      grid-template-columns: repeat(4,1fr);
    }

    .benefit {
      padding: 5px 28px;
      border-right: 1px solid rgba(80,60,50,.12);
    }

    .benefit:last-child {
      border-right: none;
    }

    .benefit-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .benefit p {
      font-size: 12px;
      color: var(--brown);
    }


    /* VALMENNUKSET */

    .coaching {
      padding: 90px 6% 110px;
      background: var(--cream);
    }

    .section-head {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-label {
      color: var(--rose);
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    h2 {
      font-size: clamp(32px,3vw,44px);
      font-weight: 300;
      letter-spacing: -1.5px;
      line-height: 1.2;
    }

    .cards {
      max-width: 1280px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 24px;
    }

    .card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(50,35,30,.07);
      transition: .25s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-image {
      height: 280px;
      background-size: cover;
      background-position: center;
    }

    .training-image {
      background-image: url("treenivalmennus.jpeg");
      background-position: center 32%;
    }

    .nutrition-image {
      background-image: url("ravintovalmennus.jpeg");
      background-position: center center;
    }

    .monthly-image {
      background-image: url("kuukausivalmennus.jpeg");
      background-position: 60% 55%;
    }

    .card-content {
      padding: 28px;
    }

    .card h3 {
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .card p {
      color: var(--brown);
      font-size: 13px;
      min-height: 82px;
    }

    .price {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 500;
    }

    .read-more {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      color: var(--rose);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .read-more:hover {
      color: var(--rose-dark);
    }


    /* ABOUT */

    .about {
      display: grid;
      grid-template-columns: 45% 55%;
      min-height: 600px;
      background: var(--beige);
    }

    .about-image {
      background-image: url("Esittely.png");
      background-size: cover;
      background-position: center 15%;
      min-height: 600px;
    }

    .about-content {
      padding: 90px 12%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .about-content p {
      max-width: 600px;
      margin: 24px 0 30px;
      color: var(--brown);
      font-size: 14px;
      line-height: 1.85;
    }


    /* CONTACT */

    .contact {
      padding: 100px 6% 110px;
      background: var(--white);
    }

    .contact-container {
      max-width: 850px;
      margin: 0 auto;
    }

    .contact-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .contact-heading p {
      max-width: 680px;
      margin: 20px auto 0;
      color: var(--brown);
      font-size: 14px;
      line-height: 1.85;
    }

    .contact-heading a {
      color: var(--rose-dark);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-heading a:hover {
      text-decoration: underline;
    }

    .contact-form {
      max-width: 760px;
      margin: 0 auto;
      padding: 45px;
      background: var(--cream);
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(50,35,30,.05);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d8cec8;
      border-radius: 6px;
      outline: none;
      background: var(--white);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      transition: .2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 2px rgba(189,133,120,.08);
    }

    .form-group textarea {
      min-height: 160px;
      resize: vertical;
    }

    .form-submit {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }


    /* FOOTER */

    footer {
      background: var(--text);
      color: #eee6e1;
      text-align: center;
      padding: 35px;
      font-size: 11px;
      letter-spacing: .8px;
    }
